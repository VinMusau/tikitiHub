# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable banner noise
spring.main.banner-mode=off

# JWT (test-only secret)
jwt.secret=dGVzdC1zZWNyZXQtZm9yLXRlc3RzLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=
jwt.expiration-ms=3600000

# M-Pesa (dummy values, no outbound calls in these tests)
mpesa.consumer-key=test-key
mpesa.consumer-secret=test-secret
mpesa.short-code=174379
mpesa.pass-key=test-pass
mpesa.callback-url=http://localhost:8080/api/payments/mpesa-callback
mpesa.base-url=https://sandbox.safaricom.co.ke

# CORS
app.cors.allowed-origins=http://localhost:*

# Platform fee
app.platform.fee-percent=5

# Mail (disabled for tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# Frontend / ngrok (dummy values, may be referenced by config classes)
app.frontend.url=http://localhost:5173
ngrok.enabled=false
ngrok.authToken=dummy
