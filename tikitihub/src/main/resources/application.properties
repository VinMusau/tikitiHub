spring.application.name=tikitihub

# Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/tikitihub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ngrok
ngrok.enabled=true
ngrok.authToken=${NGROK_AUTH_TOKEN}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# M-Pesa
mpesa.consumer-key=${MPESA_CONSUMER_KEY}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET}
mpesa.short-code=${MPESA_SHORT_CODE:174379}
mpesa.pass-key=${MPESA_PASS_KEY}
mpesa.callback-url=${MPESA_CALLBACK_URL}
mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}